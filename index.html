<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FSD-Sim — Tesla Model 3 Interior Simulator</title>
<meta name="description" content="Real-time Tesla Model 3 interior simulator with Autopark, Autosteer, FSD, full Tesla UI and apps.">
<link rel="preload" as="font" href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;700&family=SF+Pro+Text:wght@400;500&display=swap">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ============ TESLA BOOT LOADING SCREEN ============ */
  #loading {
    position: fixed; inset: 0; background: #000; color: #fff; display: grid; place-items: center;
    z-index: 10000; font-family: 'SF Pro Display', system-ui, -apple-system, sans-serif;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  /* Tesla "T" wordmark reveal animation */
  #loading .tesla-wordmark {
    font-size: 5rem; font-weight: 700; letter-spacing: -0.04em; color: #fff;
    text-transform: uppercase; line-height: 1;
    animation: teslaReveal 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  }
  #loading .tesla-wordmark::after {
    content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, #fff 50%, transparent 100%);
    animation: teslaShine 2.2s infinite;
    pointer-events: none;
  }

  #loading .model-line {
    font-size: 1.3rem; font-weight: 500; letter-spacing: 0.25em;
    color: #e50914; text-transform: uppercase; margin-top: 10px;
    animation: fadeInUp 0.8s 0.6s both;
    opacity: 0;
  }
  #loading .sub-line {
    font-size: 0.8rem; font-weight: 400; letter-spacing: 0.2em;
    color: #666; text-transform: uppercase; margin-top: 4px;
    animation: fadeInUp 0.8s 0.9s both;
    opacity: 0;
  }

  #loading .bar {
    width: 380px; height: 4px; background: #111; border-radius: 2px;
    overflow: hidden; margin-top: 34px;
    animation: fadeInUp 0.8s 1.2s both;
    opacity: 0;
  }
  #loading .fill {
    width: 0%; height: 100%; background: #e50914;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  #loading .fill::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    animation: shimmer 2.5s infinite;
  }

  #loading .load-group {
    margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: fadeInUp 0.8s 1.5s both;
    opacity: 0;
  }
  #loading #loadText {
    font-size: 0.75rem; letter-spacing: 0.15em; color: #888;
    text-transform: uppercase; font-weight: 500; min-height: 14px;
  }
  #loading #loadPct {
    font-size: 2rem; font-variant-numeric: tabular-nums; color: #e50914;
    font-weight: 700;
  }

  @keyframes teslaReveal {
    0% { clip-path: inset(0 100% 0 0); opacity: 0; }
    50% { opacity: 0.5; }
    100% { clip-path: inset(0 0% 0 0); opacity: 1; }
  }
  @keyframes teslaShine {
    0% { left: -100%; } 100% { left: 100%; }
  }
  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); } 100% { transform: translateX(100%); }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="tesla-wordmark">TESLA</div>
  <div class="model-line">MODEL 3</div>
  <div class="sub-line">FSD-SIM · INTERIOR SIMULATOR</div>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
  <div class="load-group">
    <span id="loadText">booting systems…</span>
    <span id="loadPct">0%</span>
  </div>
</div>

<!-- ============================================================ -->
<!-- GAME CANVAS                                                  -->
<!-- ============================================================ -->
<canvas id="glcanvas" tabindex="0"></canvas>

<!-- ============================================================ -->
<!-- HUD OVERLAY (speed, gear, autopilot status)                  -->
<!-- ============================================================ -->
<div id="hud" class="hud" aria-hidden="true">
  <div class="hud-speed"><span id="speedVal">0</span><span id="speedUnit">mph</span></div>
  <div class="hud-gear" id="gearDisp">P</div>
  <div class="hud-ap" id="apDisp">
    <span id="apMode">MANUAL</span>
    <span id="apStatus" class="ap-off">OFF</span>
  </div>
  <div class="hud-notification" id="hudNote" style="display:none"></div>
</div>

<!-- ============================================================ -->
<!-- TESLA UI OVERLAY (center screen)                             -->
<!-- ============================================================ -->
<div id="teslaUI" class="tesla-ui" aria-hidden="true">
  <div class="ui-statusbar">
    <div class="ui-time" id="uiTime">12:00</div>
    <div class="ui-car">
      <div class="ui-car-door fl" id="doorFL"></div>
      <div class="ui-car-door fr" id="doorFR"></div>
      <div class="ui-car-body"></div>
      <div class="ui-car-door rl" id="doorRL"></div>
      <div class="ui-car-door rr" id="doorRR"></div>
    </div>
    <div class="ui-temp">72°</div>
    <div class="ui-battery" id="uiBattery"><div class="ui-bat-fill"></div><span>90%</span></div>
    <div class="ui-signal"></div>
  </div>

  <div class="ui-appbar">
    <button class="ui-btn" id="btnNav" title="Navigation">🗺️</button>
    <button class="ui-btn active" id="btnMedia" title="Media">🎵</button>
    <button class="ui-btn" id="btnPhone" title="Phone">📞</button>
    <button class="ui-btn" id="btnTheater" title="Theater">🎭</button>
    <button class="ui-btn" id="btnBrowser" title="Web Browser">🌐</button>
    <button class="ui-btn" id="btnClimate" title="Climate">❄️</button>
    <button class="ui-btn" id="btnControls" title="Controls">🚗</button>
    <button class="ui-btn" id="btnSettings" title="Settings">⚙️</button>
    <button class="ui-btn close" id="btnCloseUI" title="Close">✕</button>
  </div>

  <div class="ui-content" id="uiContent"></div>

  <div class="ui-bottom">
    <div class="ui-media-mini" id="uiMediaMini">
      <span id="miniTrack">Media</span><span id="miniArtist">Tap to open Media</span>
      <button class="ui-mini-play" id="miniPlay">▶</button>
    </div>
    <div class="ui-homelink" id="uiHomeLink">HomeLink: <span id="hlState">Garage Door</span></div>
  </div>
</div>

<div id="uiModal" class="ui-modal" style="display:none">
  <div class="ui-modal-box" id="uiModalBox"></div>
  <button class="ui-modal-close" id="uiModalClose">✕</button>
</div>

<!-- ============================================================ -->
<!-- CENTERSCREEN MIRROR (the big Tesla screen rendered in 3D)    -->
<!-- ============================================================ -->
<div id="screenMirror" class="screen-mirror" style="display:none;pointer-events:none"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
  }
}
</script>
<script type="module" src="js/main.js"></script>

</body>
</html>
