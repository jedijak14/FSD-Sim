<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a0a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden; }
  .navbar {
    height: 44px; background: #121212; border-bottom: 1px solid #333;
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    flex-shrink: 0; }
  .url-bar {
    flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #333;
    border-radius: 6px; padding: 0 12px; color: #999; font-size: 0.85rem;
    font-family: monospace; outline: none; }
  .url-bar:focus { border-color: #2a8cff; color: #fff; }
  .go-btn {
    width: 32px; height: 28px; background: #e50914; border: none;
    border-radius: 4px; color: #fff; font-size: 0.75rem; cursor: pointer; }
  .content {
    flex: 1; padding: 32px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 2rem; font-weight: 600; margin-bottom: 1rem; letter-spacing: -0.02em; }
  p { color: #888; font-size: 1rem; line-height: 1.6; max-width: 400px; }
  .hint { margin-top: 2rem; padding: 1rem; background: #121212;
    border: 1px solid #333; border-radius: 8px; color: #666;
    font-size: 0.9rem; max-width: 400px; }
</style>
</head>
<body>
  <div class="navbar">
    <div class="url-bar" id="urlBar">https://www.tesla.com</div>
    <button class="go-btn" id="goBtn">Go</button>
  </div>
  <div class="content">
    <h1>Tesla Browser</h1>
    <p>Enter a URL above to browse the web from your Tesla.</p>
    <div class="hint">Some websites block embedding in iframes for security reasons.</div>
  </div>
<script>
  document.getElementById('goBtn').addEventListener('click', () => {
    const u = document.getElementById('urlBar').value.trim();
    if (!u) return;
    if (!u.startsWith('http://') && !u.startsWith('https://')) {
      document.getElementById('urlBar').value = 'https://' + u;
    }
    document.body.innerHTML = '<div style="padding:32px;color:#fff;font-family:system-ui"><h2>Loading...</h2><p style="color:#888">Navigating to ' + u + '</p><iframe src="' + u + '" style="width:100%;height:calc(100vh - 120px);border:none;margin-top:16px"></iframe></div>';
  });
</script>
</body>
</html>
